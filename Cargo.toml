[package]
name = "datafusion-randgen"
version = "0.1.1"
edition = "2024"
exclude = [
  ".github/**",
  "benches/**",
  "deny.toml",
  "dprint.json",
  "fuzz/**",
  "justfile",
  "tests/**",
]
keywords = ["datafusion", "random", "data", "generator"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/corasaurus-hex/datafusion-randgen"
rust-version = "1.94.0"
description = "Random data generator UDFs for Apache DataFusion"

[features]
default = []
column-choice-arrow-ipc = ["dep:arrow-ipc", "dep:datafusion-roaring", "dep:roaring"]
column-choice-parquet = ["dep:datafusion-roaring", "dep:parquet", "dep:roaring"]

[dependencies]
arrow-array = { version = "59.3.0", default-features = false }
arrow-ipc = { version = "60.0.0", optional = true, default-features = false }
arrow-schema = { version = "59.3.0", default-features = false }
datafusion-common = { version = "55.0.0", default-features = false }
datafusion-expr = { version = "55.0.0", default-features = false }
datafusion-roaring = { version = "0.1.0", optional = true }
parquet = { version = "59.3.0", optional = true, default-features = false, features = ["arrow", "snap"] }
rand = "0.10.2"
rand_distr = "0.6.0"
roaring = { version = "0.11.5", optional = true }

[dev-dependencies]
arrow-buffer = { version = "59.3.0", default-features = false }
arrow-ipc = { version = "60.0.0", default-features = false }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
datafusion = { version = "55.0.0", default-features = false, features = ["sql", "nested_expressions"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", features = ["full"] }

[[bench]]
name = "udfs"
harness = false
