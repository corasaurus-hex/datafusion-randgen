[package]
name = "datafusion-randgen"
version = "0.1.0"
edition = "2024"
description = "A random data generator for Apache DataFusion"
license = "MIT"
keywords = ["datafusion", "random", "data", "generator"]
repository = "https://github.com/corasaurus-hex/datafusion-randgen"
readme = "README.md"
rust-version = "1.89.0"

[dependencies]
arrow-array = { version = "58.0.0", default-features = false }
arrow-schema = { version = "58.0.0", default-features = false }
datafusion-common = { version = "53.1.0", default-features = false }
datafusion-expr = { version = "53.1.0", default-features = false }
rand = "0.9.2"
rand_distr = "0.5.1"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
datafusion = { version = "53.1.0", default-features = false, features = ["sql", "nested_expressions"] }
tokio = { version = "1.42.0", features = ["full"] }

[[bench]]
name = "udfs"
harness = false
